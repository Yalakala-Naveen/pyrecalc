[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrecalc"
version = "0.1.0"
description = "Evaluate Excel formulas in Python without Excel — and verify generated workbooks against their own cached values."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naveen Yalakala" }]
keywords = ["excel", "xlsx", "openpyxl", "formulas", "recalculation", "verification"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/Yalakala-Naveen/pyrecalc"
Issues = "https://github.com/Yalakala-Naveen/pyrecalc/issues"

[project.scripts]
pyrecalc = "pyrecalc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
